name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the action push to the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up uv (Python deps for code chunks)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python environment from lockfile
        run: uv sync --frozen

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          # Run Quarto inside the uv-managed environment:
          path: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_PYTHON: .venv/bin/python
